name: IBRA Python Engine Tests

on:
  push:
    branches:
      - n8n-python-engine
    paths:
      - 'n8n-engine/**'
      - '.github/workflows/ibra-engine-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-engine
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest -v
